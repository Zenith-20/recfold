[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "recfold"
version = "1.0.1"
description = "Zero-runtime-dependency recursion call-tree analyzer and state inspector for Python."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Zenith-20" },
  { name = "ssartayev" },
  { name = "Alishnis" },
  { name = "bekonty" },
  { name = "exehamza" },
  { name = "thecocogoat" },
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/Zenith-20/recfold"
Repository = "https://github.com/Zenith-20/recfold"

[tool.hatch.build.targets.wheel]
packages = ["src/recfold"]